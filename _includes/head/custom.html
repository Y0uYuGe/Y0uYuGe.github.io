{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="{{ '/assets/css/academicons.min.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | relative_url }}"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ '/assets/css/fontawesome.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ '/assets/css/fontawesome.css' | relative_url }}"></noscript>

<!-- Custom theme overrides -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}"/>
<link rel="stylesheet" href="{{ '/assets/css/blog-browser.css' | relative_url }}"/>
{% if page.url == "/portfolio/" or page.collection == "portfolio" %}
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}"/>
{% endif %}

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}"/>
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}"/>
<link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ '/images/favicon-192x192.png' | relative_url }}" sizes="192x192"/>
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}"/>
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}"/>
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)"/>

<!-- end custom head snippets -->
