<h1 id="cisc-和-risc">CISC 和 RISC</h1>
<p> 存储程序的计算机由电路加存储部件组成<br><img src="/workspace/software-foundations/computer-organization/04-%E6%8C%87%E4%BB%A4%E7%B3%BB%E7%BB%9F/%E8%AE%A1%E7%AE%97%E6%9C%BA%E7%BB%84%E6%88%90%E5%8E%9F%E7%90%86%20-%20%E6%8C%87%E4%BB%A4%E9%9B%86%EF%BC%9ACISC%20%E5%92%8C%20RISC/assets/csdn-135039555/image-002-3e9733ff16.png" alt="图片"></p>
<p>访存指令不同<br>RISC 更加灵活，因为很多功能不是固定的，而是由自己编写<br>由于 CISC 指令的执行时间各不相同，实现指令流水线更加困难<br>由于 CISC 对访存指令不加限制，过程没那么繁琐，需要的辅助寄存器也更少</p>
