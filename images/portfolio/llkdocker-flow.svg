<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" role="img" aria-labelledby="title desc">
  <title id="title">llkdocker volume exercise execution flow</title>
  <desc id="desc">The parent prepares OverlayFS and a bind volume, starts an init process in Linux namespaces, assigns cgroup settings, and sends the command through a pipe. The child changes root, mounts proc and dev, and executes the command. The parent waits and cleans up.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a7412a"/>
    </marker>
  </defs>
  <rect width="680" height="650" rx="16" fill="#faf8f3"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle" fill="#343638">
    <text x="340" y="38" font-size="18" letter-spacing="2" fill="#79756d">VOLUME_DOCKER · SOURCE OVERVIEW</text>
    <g fill="#ffffff" stroke="#ded7ca" stroke-width="1.5">
      <rect x="48" y="62" width="584" height="98" rx="9"/>
      <rect x="48" y="196" width="584" height="98" rx="9"/>
      <rect x="48" y="330" width="584" height="98" rx="9"/>
      <rect x="48" y="464" width="584" height="98" rx="9"/>
    </g>
    <g font-size="24" font-weight="600">
      <text x="340" y="100">1 · CLI and filesystem preparation</text>
      <text x="340" y="234">2 · Start the isolated init process</text>
      <text x="340" y="368">3 · Configure resources and send command</text>
      <text x="340" y="502">4 · Switch root and execute</text>
    </g>
    <g font-size="19" fill="#6a675f">
      <text x="340" y="133">OverlayFS layers + host bind volume</text>
      <text x="340" y="267">UTS · PID · mount · network · IPC namespaces</text>
      <text x="340" y="401">Parent: cgroup assignment → inherited pipe</text>
      <text x="340" y="535">Child: pivot_root → /proc and /dev → exec</text>
    </g>
    <text x="340" y="611" font-size="20" fill="#79756d">Parent waits, then runs cleanup routines</text>
  </g>
  <g stroke="#a7412a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 340 163 V 188"/>
    <path d="M 340 297 V 322"/>
    <path d="M 340 431 V 456"/>
  </g>
</svg>
